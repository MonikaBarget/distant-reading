name: Build & Deploy JupyterLite Pyodide to GitHub Pages

on:
  push:
    branches: [ jupyterlite ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean previous build
        run: rm -rf dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install JupyterLite toolchain
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel --quiet
          pip install -r requirements.txt --quiet
          jupyter lite --version

      - name: Build JupyterLite site
        run: |
          set -euxo pipefail
          jupyter lite build \
            --lite-dir jupyterlite \
            --contents jupyterlite/contents/notebooks \
            --output-dir dist/jupyterlite \
            --base-url /distant-reading/jupyterlite/
          test -f dist/jupyterlite/index.html
          test -f dist/jupyterlite/lab/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/jupyterlite
          destination_dir: jupyterlite
          keep_files: true
