name: Build & Deploy JupyterLite Pyodide to GitHub Pages

on:
  push:
    branches: [ jupyterlite ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jupyterlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean previous build and caches
        run: |
          set -euxo pipefail
          rm -rf dist standalone/jupyterlite
          rm -f .doit.db .doit* .jupyterlite.doit.db db.json || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install JupyterLite toolchain (Pyodide 0.26 compatible)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel --quiet
          pip install -r requirements.txt --quiet
          jupyter lite --version

      - name: Create JupyterLite overrides configuration
        run: |
          mkdir -p jupyterlite/contents
          cat > jupyterlite/contents/overrides.json << 'EOF'
          {
            "baseUrl": "/distant-reading/jupyter/",
            "appUrl": "/distant-reading/jupyter/lab",
            "litePluginSettings": {
              "@jupyterlite/pyodide-kernel-extension:kernel": {
                "pyodideUrl": "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"
              }
            }
          }
          EOF
          echo "Created overrides.json with baseUrl and pyodideUrl"

      - name: Build JupyterLite site
        run: |
          set -euxo pipefail
          mkdir -p standalone
          rm -rf standalone/jupyterlite
          jupyter lite build \
            --contents ./jupyterlite/contents \
            --output-dir standalone/jupyterlite \
            --debug
          test -f standalone/jupyterlite/index.html
          test -f standalone/jupyterlite/lab/index.html

      - name: Verify and patch JupyterLite config
        run: |
          set -euxo pipefail
          python3 << 'PYSCRIPT'
import json
import re

html_file = "standalone/jupyterlite/lab/index.html"

# Read HTML
with open(html_file, 'r') as f:
    html_content = f.read()

# Check if config is already embedded
if '"baseUrl"' in html_content and '"pyodideUrl"' in html_content:
    print("✓ Config already properly embedded in HTML")
else:
    print("⚠ Config missing or incomplete, patching now...")
    
    config = {
        "jupyter-config-data": {
            "baseUrl": "/distant-reading/jupyter/",
            "appUrl": "/distant-reading/jupyter/lab",
            "litePluginSettings": {
                "@jupyterlite/pyodide-kernel-extension:kernel": {
                    "pyodideUrl": "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"
                }
            }
        },
        "jupyter-lite-schema-version": 0
    }
    
    config_json = json.dumps(config)
    
    # Replace {} placeholder
    html_content = re.sub(
        r'<script[^>]*id="jupyter-config-data"[^>]*>\s*\{\}\s*</script>',
        f'<script id="jupyter-config-data" type="application/json">{config_json}</script>',
        html_content
    )
    
    # Write patched HTML
    with open(html_file, 'w') as f:
        f.write(html_content)
    
    print("✓ Config patched into HTML successfully")
    
    # Verify patch
    if '"baseUrl"' in html_content and '"pyodideUrl"' in html_content:
        print("✓ Verification: Config is now in HTML")
    else:
        print("✗ ERROR: Patch failed, config still missing")
        exit(1)
PYSCRIPT

      - name: Download Pyodide runtime locally (with retries)
        run: |
          set -euxo pipefail
          PYODIDE_VER="0.26.2"
          BASE="https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VER}/full"
          OUT="standalone/jupyterlite/pyodide"
          mkdir -p "${OUT}"

          # Download with 5-second timeout and 3 retries
          for file in pyodide.js pyodide.mjs repodata.json; do
            curl --connect-timeout 5 --max-time 30 --retry 3 \
              -fL "${BASE}/${file}" -o "${OUT}/${file}" || true
          done

          # Try to get WASM file (optional, can be served from CDN)
          (curl --connect-timeout 5 --max-time 30 --retry 2 \
            -fL "${BASE}/pyodide.wasm" -o "${OUT}/pyodide.wasm" \
            || curl --connect-timeout 5 --max-time 30 --retry 2 \
            -fL "${BASE}/pyodide.asm.wasm" -o "${OUT}/pyodide.asm.wasm") || true

          # Verify critical file exists
          test -f "${OUT}/pyodide.js"

      - name: Assemble publish directory with jupyter/ subdirectory
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/jupyter
          cp -r standalone/jupyterlite/* dist/jupyter/
          touch dist/.nojekyll
          
          test -f dist/jupyter/index.html
          test -f dist/jupyter/lab/index.html
          test -f dist/jupyter/pyodide/pyodide.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
