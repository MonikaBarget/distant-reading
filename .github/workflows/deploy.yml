name: Build & Deploy JupyterLite Pyodide to GitHub Pages

on:
  push:
    branches: [ jupyterlite ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jupyterlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean previous build and caches
        run: |
          set -euxo pipefail
          rm -rf dist standalone/jupyterlite
          rm -f .doit.db .doit* .jupyterlite.doit.db db.json || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install JupyterLite toolchain (Pyodide 0.26 compatible)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel --quiet
          pip install -r requirements.txt --quiet
          jupyter lite --version

      - name: Create JupyterLite configuration
        run: |
          cat > jupyter-lite.json << 'EOF'
          {
            "jupyter-lite-schema-version": 0,
            "jupyter-config-data": {
              "baseUrl": "/distant-reading/jupyter/",
              "litePluginSettings": {
                "@jupyterlite/pyodide-kernel-extension:kernel": {
                  "pyodideUrl": "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"
                }
              }
            }
          }
          EOF
          echo "Configured JupyterLite with baseUrl=/distant-reading/jupyter/"
          echo "Configured Pyodide entry: https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"

      - name: Build JupyterLite site
        run: |
          set -euxo pipefail
          mkdir -p standalone
          rm -rf standalone/jupyterlite
          jupyter lite build \
            --contents ./jupyterlite/contents \
            --output-dir standalone/jupyterlite \
            --debug
          test -f standalone/jupyterlite/index.html
          test -f standalone/jupyterlite/lab/index.html

      - name: Patch JupyterLite HTML config embedding
        run: |
          set -euxo pipefail
          CONFIG_FILE="standalone/jupyterlite/jupyter-lite.json"
          HTML_FILE="standalone/jupyterlite/lab/index.html"

          if [ -f "$CONFIG_FILE" ] && [ -f "$HTML_FILE" ]; then
            echo "Embedding JupyterLite config into HTML..."
            CONFIG_JSON=$(jq -c '.' "$CONFIG_FILE")

            # Replace the {} JSON block inside the multiline <script> tag
            awk -v json="$CONFIG_JSON" '
              /<script id="jupyter-config-data"/ {in_block=1; print; next}
              in_block && /{}/ {print json; next}
              in_block && /<\/script>/ {in_block=0}
              {print}
            ' "$HTML_FILE" > "${HTML_FILE}.tmp" && mv "${HTML_FILE}.tmp" "$HTML_FILE"
          else
            echo "Config or HTML file not found; skipping patch."
          fi

      - name: Download Pyodide runtime locally (with retries)
        run: |
          set -euxo pipefail
          PYODIDE_VER="0.26.2"
          BASE="https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VER}/full"
          OUT="standalone/jupyterlite/pyodide"
          mkdir -p "${OUT}"

          # Download with 5-second timeout and 3 retries
          for file in pyodide.js pyodide.mjs repodata.json; do
            curl --connect-timeout 5 --max-time 30 --retry 3 \
              -fL "${BASE}/${file}" -o "${OUT}/${file}" || true
          done

          # Try to get WASM file (optional, can be served from CDN)
          (curl --connect-timeout 5 --max-time 30 --retry 2 \
            -fL "${BASE}/pyodide.wasm" -o "${OUT}/pyodide.wasm" \
            || curl --connect-timeout 5 --max-time 30 --retry 2 \
            -fL "${BASE}/pyodide.asm.wasm" -o "${OUT}/pyodide.asm.wasm") || true

          # Verify critical file exists
          test -f "${OUT}/pyodide.js"

      - name: Assemble publish directory with jupyter/ subdirectory
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/jupyter
          cp -r standalone/jupyterlite/* dist/jupyter/
          touch dist/.nojekyll
          
          test -f dist/jupyter/index.html
          test -f dist/jupyter/lab/index.html
          test -f dist/jupyter/pyodide/pyodide.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
